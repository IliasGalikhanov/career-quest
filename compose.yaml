name: career-quest
services:
  app:
    build: .
    ports:
      - "127.0.0.1:${CQ_PORT:-8080}:8080"
    volumes:
      - career-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 15s
volumes:
  career-data:
