name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go format and static analysis
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./cmd/... ./internal/...
      - name: Go tests and race detector
        run: go test -race -cover ./cmd/... ./internal/...
      - name: Reproduce synthetic example
        run: |
          go run ./cmd/demo /tmp/demo.json
          cmp examples/demo.json /tmp/demo.json
      - name: Install and check frontend
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: web/test-results/
      - name: Docker build and health
        run: |
          docker compose up --build -d --wait
          curl --fail http://127.0.0.1:8080/api/health
          python3 scripts/check_persistence.py
      - name: Stop containers
        if: always()
        run: docker compose down
